<!DOCTYPE html>

<head>

<style>

body{
    background:#fff7f8;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

.success-box{
    background:white;
    width:650px;

.success-icon{
    font-size:90px;
    color:#28a745;

h1{
    color:#ef476f;

.order-id{

    padding:15px;

.details{

    margin-top:30px;

.details p{
    font-size:18px;
    margin-bottom:12px;

.btn-home{

    margin-top:30px;
    font-size:18px;
    font-weight:bold;

.btn-home:hover{
    background:#d6336c;
    color:white;
}

.btn-menu{
    border-radius:30px;

    font-weight:bold;
